<script>

 /* =========================================================
   SUVI INFOTECH - WORK UPDATES
   ========================================================= */

let workUpdates = JSON.parse(
    localStorage.getItem("suviWorkUpdates") || "[]"
);

let workModalMode = "add";
let editingWorkItem = null;


/* =========================================================
   WORK ID - WK01, WK02, WK03...
   ========================================================= */

function getNextWorkNumber() {

    let maxNumber = 0;

    workUpdates.forEach(item => {

        const value = String(item.workId || "").trim();

        // WK01 / WK001 / WK1
        const wkMatch = value.match(/^WK(\d+)$/i);

        if (wkMatch) {

            const number = parseInt(wkMatch[1], 10);

            if (number > maxNumber) {
                maxNumber = number;
            }

        } else if (/^\d+$/.test(value)) {

            // Old numeric ID: 1, 2, 3...
            const number = parseInt(value, 10);

            if (number > maxNumber) {
                maxNumber = number;
            }
        }
    });

    return maxNumber + 1;
}


/* =========================================================
   NORMALIZE OLD WORK IDs
   Old: 1, 2, 3
   New: WK01, WK02, WK03
   ========================================================= */

function normalizeWorkIds() {

    let changed = false;

    workUpdates.forEach((item, index) => {

        const oldId = String(item.workId || "").trim();

        // If ID is numeric or missing, assign sequential WK ID
        if (!/^WK\d+$/i.test(oldId)) {

            item.workId =
                "WK" + String(index + 1).padStart(2, "0");

            changed = true;
        }
    });

    // Also fix duplicate WK IDs
    const usedIds = new Set();

    workUpdates.forEach(item => {

        let id = String(item.workId || "").trim();

        if (!id || usedIds.has(id.toUpperCase())) {

            let nextNumber = getNextWorkNumber();

            id =
                "WK" + String(nextNumber).padStart(2, "0");

            item.workId = id;

            changed = true;
        }

        usedIds.add(id.toUpperCase());
    });

    if (changed) {

        localStorage.setItem(
            "suviWorkUpdates",
            JSON.stringify(workUpdates)
        );
    }
}


/* =========================================================
   DATE
   ========================================================= */

function getLocalDate() {

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(now.getMonth() + 1).padStart(2, "0");

    const day =
        String(now.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


function formatDate(dateString) {

    if (!dateString) return "-";

    const parts =
        String(dateString).split("-");

    if (parts.length !== 3) {
        return dateString;
    }

    return `${parts[2]}-${parts[1]}-${parts[0]}`;
}


/* =========================================================
   SAFE DISPLAY
   ========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function escapeAttribute(value) {

    return String(value ?? "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");
}


/* =========================================================
   LOAD TABLE
   ========================================================= */

function loadWorkUpdates() {

    const tbody =
        document.getElementById("workTableBody");

    const emptyState =
        document.getElementById("emptyState");

    if (!tbody) return;


    tbody.innerHTML = "";


    const dateFilter =
        document.getElementById("dateFilter");

    const searchBox =
        document.getElementById("searchBox");

    const statusFilter =
        document.getElementById("statusFilter");


    const dateValue =
        dateFilter ? dateFilter.value : "";

    const searchValue =
        searchBox
            ? searchBox.value.toLowerCase().trim()
            : "";

    const statusValue =
        statusFilter
            ? statusFilter.value
            : "";


    const filtered =
        workUpdates.filter(item => {

            const workId =
                String(item.workId || "").toLowerCase();

            const work =
                String(item.work || "").toLowerCase();

            const dept =
                String(item.dept || "").toLowerCase();

            const parts =
                String(item.parts || "").toLowerCase();

            const client =
                String(item.client || "").toLowerCase();

            const amount =
                String(item.amount || "").toLowerCase();

            const status =
                String(item.status || "");


            const dateMatch =
                !dateValue ||
                item.date === dateValue;


            const searchMatch =
                !searchValue ||
                workId.includes(searchValue) ||
                work.includes(searchValue) ||
                dept.includes(searchValue) ||
                parts.includes(searchValue) ||
                client.includes(searchValue) ||
                amount.includes(searchValue);


            const statusMatch =
                !statusValue ||
                status === statusValue;


            return (
                dateMatch &&
                searchMatch &&
                statusMatch
            );
        });


    filtered.forEach(item => {

        const row =
            document.createElement("tr");


        let statusClass = "pending";


        if (item.status === "Completed") {

            statusClass = "completed";

        } else if (item.status === "In Progress") {

            statusClass = "in-progress";

        } else if (item.status === "Cancel") {

            statusClass = "cancel";
        }


        row.innerHTML = `

            <td>
                ${formatDate(item.date)}
            </td>

            <td>
                <span class="work-id-highlight">
                    ${escapeHtml(item.workId)}
                </span>
            </td>

            <td>
                <span class="work-highlight">
                    ${escapeHtml(item.work || "-")}
                </span>
            </td>

            <td>
                ${escapeHtml(item.dept || "-")}
            </td>

            <td>
                ${escapeHtml(item.parts || "-")}
            </td>

            <td>
                ${escapeHtml(item.qty || "1")}
            </td>

            <td>
                <span class="client-highlight">
                    ${escapeHtml(item.client || "-")}
                </span>
            </td>

            <td>
                <span class="amount-highlight">
                    ₹ ${escapeHtml(item.amount || "0")}
                </span>
            </td>

            <td>
                <span class="status ${item.paymentType === "Cash" ? "completed" : "pending"}">
                    ${escapeHtml(item.paymentType || "Credit")}
                </span>
            </td>

            <td>
                <span class="status ${statusClass}">
                    ${escapeHtml(item.status || "Completed")}
                </span>
            </td>

            <td class="action-cell">

                <button
                    class="edit-btn"
                    onclick="editWorkUpdate('${escapeAttribute(item.workId)}')">
                    ✏️ Edit
                </button>

                <button
                    class="delete-btn"
                    onclick="deleteWorkUpdate('${escapeAttribute(item.workId)}')">
                    🗑️ Delete
                </button>
                <button
    class="whatsapp-btn"
    onclick="sendWorkWhatsApp('${escapeAttribute(item.workId)}')">
    💬 WhatsApp
</button>
            </td>
        `;


        tbody.appendChild(row);
    });


    if (emptyState) {

        emptyState.style.display =
            filtered.length ? "none" : "block";
    }
}


/* =========================================================
   OPEN ADD / EDIT MODAL
   ========================================================= */

function openWorkModal(mode = "add", item = null) {

    workModalMode = mode;
    editingWorkItem = item;


    const modal =
        document.getElementById("workModal");

    if (!modal) {

        alert("Work Update modal not found.");
        return;
    }


    const title =
        document.getElementById("workModalTitle");


    const service =
        document.getElementById("workFormService");

    const dept =
        document.getElementById("workFormDept");

    const qty =
        document.getElementById("workFormQty");

    const parts =
        document.getElementById("workFormParts");

    const client =
        document.getElementById("workFormClient");

    const amount =
        document.getElementById("workFormAmount");

    const paymentType =
        document.getElementById("workFormPaymentType");

    const status =
        document.getElementById("workFormStatus");


    if (mode === "edit" && item) {

        if (title) {
            title.textContent = "Edit Work Update";
        }

        if (service) {
            service.value = item.work || "";
        }

        if (dept) {
            dept.value = item.dept || "";
        }

        if (qty) {
            qty.value = item.qty || "1";
        }

        if (parts) {
            parts.value = item.parts || "";
        }

        if (client) {
            client.value = item.client || "";
        }

        if (amount) {
            amount.value = item.amount || "0";
        }

        if (paymentType) {
            paymentType.value = item.paymentType || "Credit";
        }

        if (status) {
            status.value = item.status || "Completed";
        }

    } else {

        if (title) {
            title.textContent = "Add Work Update";
        }

        if (service) {
            service.value = "";
        }

        if (dept) {
            dept.value = "";
        }

        if (qty) {
            qty.value = "1";
        }

        if (parts) {
            parts.value = "";
        }

        if (client) {
            client.value = "";
        }

        if (amount) {
            amount.value = "";
        }

        if (paymentType) {
            paymentType.value = "Cash";
        }

        if (status) {
            status.value = "Completed";
        }
    }


    loadWorkSuggestions();


    modal.style.display = "flex";
}


/* =========================================================
   CLOSE MODAL
   ========================================================= */

function closeWorkModal() {

    const modal =
        document.getElementById("workModal");

    if (modal) {
        modal.style.display = "none";
    }

    workModalMode = "add";
    editingWorkItem = null;
}


/* =========================================================
   ADD WORK UPDATE
   ========================================================= */

function addWorkUpdate() {

    openWorkModal("add");
}


/* =========================================================
   SAVE WORK UPDATE
   New + Edit
   ========================================================= */

function saveWorkModal() {

    const work =
        document.getElementById("workFormService")
            .value
            .trim();


    const dept =
        document.getElementById("workFormDept")
            .value
            .trim() || "-";


    const qty =
        document.getElementById("workFormQty")
            .value || "1";


    const parts =
        document.getElementById("workFormParts")
            .value
            .trim() || "-";


    const client =
        document.getElementById("workFormClient")
            .value
            .trim() || "-";


    const amount =
        document.getElementById("workFormAmount")
            .value
            .trim() || "0";


    const paymentType =
        document.getElementById("workFormPaymentType")
            .value || "Cash";


    const status =
        document.getElementById("workFormStatus")
            .value || "Completed";


    if (!work) {

        alert("Please enter Service / Work");

        return;
    }


    /* -----------------------------------------
       EDIT EXISTING RECORD
       ----------------------------------------- */

    if (
        workModalMode === "edit" &&
        editingWorkItem
    ) {

        editingWorkItem.work =
            work;

        editingWorkItem.dept =
            dept;

        editingWorkItem.qty =
            qty;

        editingWorkItem.parts =
            parts;

        editingWorkItem.client =
            client;

        editingWorkItem.amount =
            amount;

        editingWorkItem.paymentType =
            paymentType;

        editingWorkItem.status =
            status;


        // IMPORTANT:
        // Work ID is NOT changed during edit.


        localStorage.setItem(
            "suviWorkUpdates",
            JSON.stringify(workUpdates)
        );


        loadWorkUpdates();

        closeWorkModal();

        alert(
            "Work Update Updated Successfully"
        );

        return;
    }


    /* -----------------------------------------
       NEW RECORD
       ----------------------------------------- */

    const nextNumber =
        getNextWorkNumber();


    const workId =
        "WK" +
        String(nextNumber).padStart(2, "0");


    workUpdates.push({

        date: getLocalDate(),

        workId: workId,

        work: work,

        dept: dept,

        parts: parts,

        qty: qty,

        client: client,

        amount: amount,

        paymentType: paymentType,

        status: status
    });


    localStorage.setItem(
        "suviWorkUpdates",
        JSON.stringify(workUpdates)
    );


    loadWorkUpdates();

    closeWorkModal();


    alert(
        "Work Update Saved Successfully\nWork ID: " +
        workId
    );
}


/* =========================================================
   EDIT
   ========================================================= */

function editWorkUpdate(workId) {

    const item =
        workUpdates.find(
            item =>
                String(item.workId) ===
                String(workId)
        );


    if (!item) {

        alert("Work Update not found.");

        return;
    }


    openWorkModal(
        "edit",
        item
    );
}


/* =========================================================
   DELETE
   ========================================================= */

function deleteWorkUpdate(workId) {

    const item =
        workUpdates.find(
            item =>
                String(item.workId) ===
                String(workId)
        );


    if (!item) return;


    const confirmed =
        confirm(
            "Delete Work Update " +
            workId +
            "?"
        );


    if (!confirmed) return;


    workUpdates =
        workUpdates.filter(
            item =>
                String(item.workId) !==
                String(workId)
        );


    localStorage.setItem(
        "suviWorkUpdates",
        JSON.stringify(workUpdates)
    );


    loadWorkUpdates();
}

function sendWorkWhatsApp(workId) {

    const item = workUpdates.find(
        item => String(item.workId) === String(workId)
    );

    if (!item) {
        alert("Work Update not found.");
        return;
    }

    const clientName = String(item.client || "").trim();

    if (!clientName || clientName === "-") {
        alert("Client name not available.");
        return;
    }

    // Client Master data
    const savedClients =
        localStorage.getItem("suviInfotechClients");

    if (!savedClients) {
        alert("Client Master data not found.");
        return;
    }

    let clients = [];

    try {
        clients = JSON.parse(savedClients);
    } catch (error) {
        alert("Client Master data error.");
        return;
    }

    // Find client by name
    const client = clients.find(
        c =>
            String(c.contactPerson || "").trim().toLowerCase() ===
            clientName.toLowerCase()
    );

    if (!client) {
        alert("Client not found in Client Master.");
        return;
    }

    const mobileNumber =
        String(client.mobileNumber || "").replace(/\D/g, "");

    if (!/^[6-9]\d{9}$/.test(mobileNumber)) {
        alert("Valid mobile number not found for this client.");
        return;
    }

    const message =
`Hello ${clientName},

SUVI INFOTECH

Work ID: ${item.workId}
Service / Work: ${item.work || "-"}
Parts / Material: ${item.parts || "-"}
Qty: ${item.qty || "1"}
Amount: ${item.amount || "-"}
Payment: ${item.paymentType || "Credit"}
Status: ${item.status || "-"}

Thank you,
SUVI INFOTECH`;

    const whatsappUrl =
        "https://wa.me/91" +
        mobileNumber +
        "?text=" +
        encodeURIComponent(message);

    window.open(whatsappUrl, "_blank");
}
